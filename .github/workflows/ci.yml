name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Missing shellcheck/shfmt must fail the build rather than be skipped.
  BASHING_STRICT_TOOLS: "1"
  SHFMT_VERSION: v3.10.0

jobs:
  check:
    name: lint / fmt / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Install shfmt
        run: |
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Lint
        run: make lint

      - name: Format check
        run: make fmt-check

      - name: Test
        run: make test
